name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # tests/render/ drives tools/inject.mjs through node, so the render
      # goldens need pdf-lib, pdfjs-dist and canvas. node_modules/ is
      # gitignored, so without this the render suite fails with
      # ERR_MODULE_NOT_FOUND rather than skipping -- caught on CI's first run.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install (python)
        run: pip install -r requirements.txt

      - name: Install (node)
        run: npm ci

      # WHAT THIS DOES AND DOES NOT PROVE.
      #
      # scripts/verify.sh is the project's real gate: the test suite AND the
      # detection eval scored against scores/HEAD_BASELINE.json. Only the first
      # half can run here. The eval needs eval/corpus/tuning and eval/holdout,
      # 165 real government forms that are gitignored (36MB, and they are
      # stripped copies of fetched originals rather than anything this repo
      # should redistribute). Without them the scorer has nothing to score.
      #
      # So CI catches broken behaviour and broken contracts. It CANNOT catch a
      # recall regression -- a change can pass everything here and still make
      # the detector worse across the corpus. That is exactly the failure mode
      # scripts/verify.sh exists for, and it still has to be run locally before
      # merging anything that touches engine/.
      #
      # Tests that need the corpus already skip themselves (skipUnless on the
      # path), so this is green on a clean checkout rather than red.
      # eval/synth is ignored, not fixed. Its generators (eval/synth/hard.py,
      # eval/synth/generate.py) load Webdings and Wingdings from
      # /System/Library/Fonts/Supplemental/, which exists only on macOS, so all
      # 13 of its tests error on ubuntu. Those generators are a protected path
      # under AUTOPILOT.md -- the adversarial corpus and its generator/truth --
      # so CI works around them rather than editing them. Consequence: the
      # synthetic hard-corpus suite is macOS-only and runs locally, never here.
      - name: Tests
        run: python -m pytest -q --ignore=eval/adversarial --ignore=eval/synth

      - name: Detection eval (skipped, corpus not in repo)
        run: |
          echo "::notice title=Detection gate not run::scripts/verify.sh's eval"\
               "half needs eval/corpus (gitignored). Run ./scripts/verify.sh"\
               "locally before merging changes to engine/."

  # Build the static site and push it to Cloudflare. Runs only on a real push
  # to main (that is, after a PR merges), never on pull_request builds, and
  # only once the tests job is green -- so a merge that broke the contracts
  # never reaches production. There is no server: build_site.py assembles the
  # ./site directory wrangler.jsonc serves, and wrangler uploads it.
  #
  # Requires one repo secret, CLOUDFLARE_API_TOKEN (an account-scoped token
  # with Workers Scripts:Edit). If the account cannot be inferred from the
  # token, also add CLOUDFLARE_ACCOUNT_ID and pass it as accountId below.
  deploy:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # build_site.py is pure Python: it pip-downloads the two pure-Python
      # wheels and assembles ./site. No node step is needed here.
      - name: Build the static site
        run: python scripts/build_site.py

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pin explicitly. Left unset, wrangler-action tries `npx --no-install
          # wrangler` against the version it actually wants (4.129.0 as of this
          # writing), that lookup fails because nothing is pre-installed, and it
          # silently falls back to installing an old hardcoded 3.90.0 instead --
          # which does not read `name` out of wrangler.jsonc correctly when
          # given an explicit --assets flag, and fails with "You need to
          # provide a name when publishing a worker" despite `name` being set.
          # Pinning skips that broken fallback path entirely.
          wranglerVersion: "4"
          # wrangler.jsonc has no `main` (this is an assets-only deployment,
          # no Worker script), and wrangler still requires a PATH or
          # --assets flag in that case -- passing neither is what "Missing
          # entry-point" means.
          command: deploy --assets ./site
